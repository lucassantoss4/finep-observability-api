x-app: &app
  build: .
  environment:
    DATABASE_PATH: /app/data/finep.db
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_TRACES_SAMPLER: always_on
  volumes:
    - app-data:/app/data
  depends_on:
    - otel-collector

services:
  api:
    <<: *app
    ports: ['127.0.0.1:8000:8000']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3
  collector:
    <<: *app
    profiles: ['collect']
    command: ['python', '-m', 'finep_api.collector']
  scheduler:
    <<: *app
    profiles: ['schedule']
    command: ['python', '-m', 'finep_api.collector', '--interval', '86400']
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes: ['./observability/collector.yaml:/etc/otelcol/config.yaml:ro']
    depends_on: [tempo, loki]
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes: ['./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro']
    ports: ['127.0.0.1:9090:9090']
  tempo:
    image: grafana/tempo:2.7.2
    command: ['-config.file=/etc/tempo.yaml']
    volumes: ['./observability/tempo.yaml:/etc/tempo.yaml:ro']
  loki:
    image: grafana/loki:3.4.2
    command: ['-config.file=/etc/loki/local-config.yaml']
    volumes: ['./observability/loki.yaml:/etc/loki/local-config.yaml:ro']
  grafana:
    image: grafana/grafana:11.6.0
    ports: ['127.0.0.1:3000:3000']
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, tempo, loki]
volumes:
  app-data:
